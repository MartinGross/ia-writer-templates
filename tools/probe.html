<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" media="all" href="github.css">
</head>
<body class="markdown-body">
  <h1>H1</h1><h2>H2</h2><h3>H3</h3><h4>H4</h4><h5>H5</h5><h6>H6</h6>
  <p id="p">Body text with <code id="code">inline code</code>.</p>
  <ul><li id="li">List item</li></ul>
  <blockquote id="bq"><p>Blockquote</p></blockquote>
  <pre id="pre"><code>code block</code></pre>
  <pre id="out"></pre>
  <script>
    const px = s => Math.round(parseFloat(s) * 100) / 100;
    const fs = sel => px(getComputedStyle(document.querySelector(sel)).fontSize);
    const out = {
      body: fs('#p'),
      lineHeight: px(getComputedStyle(document.querySelector('#p')).lineHeight),
      h1: fs('h1'), h2: fs('h2'), h3: fs('h3'),
      h4: fs('h4'), h5: fs('h5'), h6: fs('h6'),
      listItem: fs('#li'),
      blockquote: fs('#bq p'),
      inlineCode: fs('#code'),
      codeBlock: fs('#pre')
    };
    document.getElementById('out').textContent = JSON.stringify(out, null, 1);
  </script>
</body>
</html>
